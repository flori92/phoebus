name: CI PHOEBUS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install black isort flake8 mypy
          pip install pydantic pydantic-settings
      
      - name: Run Black
        run: black --check --diff --line-length=100 PHOEBUS/ tests/ scripts/
      
      - name: Run isort
        run: isort --check-only --diff --profile=black PHOEBUS/ tests/ scripts/
      
      - name: Run flake8
        run: flake8 --max-line-length=100 --extend-ignore=E203,W503 PHOEBUS/ tests/
      
      - name: Run mypy
        run: mypy --ignore-missing-imports --show-error-codes PHOEBUS/config_pydantic.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install pydantic pydantic-settings
          # Installer les dépendances sans les packages audio complexes
          grep -v "pyaudio\|webrtcvad\|silero" requirements.txt | pip install -r /dev/stdin || true
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=PHOEBUS --cov-report=xml --cov-report=term
        env:
          GEMINI_API_KEY: test-key
          PHOEBUS_WS_TOKEN: test-token-ci
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install bandit safety
      
      - name: Run Bandit security scan
        run: bandit -r PHOEBUS/ -f json -o bandit-report.json || true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
