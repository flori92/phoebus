[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
norecursedirs =
    .git
    .venv
    venv
    external
    frontend
    logs
    output
    backups
    models
    phoebus_vector_db
    phoebus_tts_cache
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
