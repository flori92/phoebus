<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S</title>
  </head>
  <body>
    <!-- Three.js renders here -->
    <canvas id="orb-canvas"></canvas>

    <div id="avatar-shell" aria-hidden="true">
      <div id="avatar-core" data-jarvis-clip="reflective" data-video-fallback="true">
        <img
          id="avatar-face-fallback"
          class="avatar-face-media avatar-face-fallback"
          src="/avatar/neutral.png"
          alt=""
          decoding="async"
          fetchpriority="high"
        />
        <video
          id="avatar-video-reflective"
          class="avatar-face-media avatar-face-video"
          src="/avatar/reflective.mp4"
          poster="/avatar/neutral.png"
          autoplay
          loop
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          aria-hidden="true"
          disablepictureinpicture
        ></video>
        <video
          id="avatar-video-expressive"
          class="avatar-face-media avatar-face-video"
          src="/avatar/expressive.mp4"
          poster="/avatar/smile.png"
          autoplay
          loop
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          aria-hidden="true"
          disablepictureinpicture
        ></video>
        <div id="avatar-halo"></div>
        <div id="avatar-scan"></div>
        <div id="avatar-eyes">
          <span class="avatar-eye avatar-eye-left"></span>
          <span class="avatar-eye avatar-eye-right"></span>
        </div>
        <div id="avatar-mouth"></div>
      </div>
    </div>

    <!-- Status text above the label -->
    <div id="status-text"></div>

    <!-- Persistent label at the very bottom -->
    <div id="assistant-label">J.A.R.V.I.S</div>

    <!-- Connection indicator — top-right -->
    <div id="connection-badge">
      <span id="connection-dot"></span>
      <span id="connection-label">connexion</span>
    </div>

    <!-- Error / info toast -->
    <div id="error-text"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
